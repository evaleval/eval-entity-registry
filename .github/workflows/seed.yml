name: Seed + publish

# The dispatch target the refresh workflows (refresh-models.yml /
# refresh-hub-stats.yml) trigger after they commit a regenerated source.
# GITHUB_TOKEN-authored pushes do NOT fire push-triggered workflows, so the
# refresh jobs `gh workflow run seed.yml` explicitly; this workflow re-seeds,
# validates the merge, and publishes the tested flat fixtures to the HF
# Dataset. The legacy registry Space uses a separate partitioned layout and is
# intentionally not restarted here (that migration requires its own review).
#
# Also runnable on demand (workflow_dispatch) to re-seed + publish after a
# manual seed edit.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Refresh workflow run waiting for this release (optional)"
        required: false
        type: string
      expected_sha:
        description: "Full 40-hex commit the caller pushed; the run checks out and publishes exactly this"
        required: false
        type: string

run-name: Seed + publish (${{ inputs.source_run_id || 'manual' }})

permissions:
  contents: read

concurrency:
  # Shared with every other live flat-data publisher on main. An invalid
  # off-main manual dispatch gets its own lane so it cannot displace a valid
  # pending production release before the guard step rejects it.
  group: ${{ github.ref == 'refs/heads/main' && 'registry-data-publish' || format('seed-nonproduction-{0}', github.run_id) }}
  cancel-in-progress: false
  # Hold every arrival instead of the default 'single', which cancels the older
  # pending run. Two dispatched children must never displace each other while
  # their parent refresh runs wait on them.
  queue: max

jobs:
  seed:
    runs-on: ubuntu-latest
    # The complete offline suite has exceeded 15 minutes on hosted runners;
    # keep the release gate bounded without cancelling it mid-verification.
    timeout-minutes: 60
    steps:
      - name: Guard production ref
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::seed + publish is production-only and must run from refs/heads/main"
          exit 1

      # A dispatch resolves `--ref main` to whatever branch head GitHub sees at
      # that instant, which can predate the caller's just-landed push. When the
      # caller pins expected_sha, check out that commit by SHA instead.
      # A pinned caller gets exactly its commit. An unpinned manual dispatch gets
      # the LIVE tip of the branch (github.ref), never github.sha: that sha is
      # resolved when the run is created and goes stale while the run waits in
      # the registry-data-publish queue.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_sha || github.ref }}

      # Fail before the ~12 minutes of seed + pytest, not in the publish guard
      # at the end. github.sha stays the (possibly stale) branch resolution from
      # the dispatch event, so log all three SHAs and never treat github.sha as
      # the published revision.
      - name: Assert checkout is the expected commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          echo "event ref=${{ github.ref }} event sha=${{ github.sha }} checked-out HEAD=$(git rev-parse HEAD) expected=${EXPECTED_SHA:-<none>}"
          if [ -n "$EXPECTED_SHA" ]; then
            echo "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::expected_sha must be a full 40-hex sha"; exit 1; }
            [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ] || { echo "::error::checkout is not expected_sha"; exit 1; }
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Sync dependencies
        run: uv sync

      # Superseded = main moved FORWARD past this checkout while we queued. The
      # newer head's own publish (a human push triggers
      # publish-registry-data.yml; a cron push dispatches its own seed child)
      # carries a superset of this tree, so skip the seed + test minutes and
      # finish green. A diverged or unverifiable head still fails here.
      - name: Skip if superseded
        id: fresh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          uv run python scripts/publish_registry_data.py --freshness-check-only \
            --require-origin-main-head --skip-if-superseded \
            ${EXPECTED_SHA:+--expected-head "$EXPECTED_SHA"}

      # Re-seed from the committed YAML and assert the merge succeeds (catches
      # any alias double-claim / schema breakage a refresh commit introduced
      # before we publish). LOCAL_MODE keeps it offline + credential-free.
      - name: Seed (validate merge)
        if: steps.fresh.outputs.superseded != 'true'
        run: LOCAL_MODE=true uv run eval-entity-registry seed --local

      - name: Run pytest
        if: steps.fresh.outputs.superseded != 'true'
        run: LOCAL_MODE=true uv run pytest -q

      # Publish the exact fixtures just tested. A second seed here would change
      # generated ids/timestamps and invalidate the evidence from pytest. The
      # guard re-runs at upload time with the same superseded-means-skip rule
      # for a head that moved DURING the tests.
      - name: Publish tested registry data
        if: steps.fresh.outputs.superseded != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          uv run python scripts/publish_registry_data.py --skip-seed \
            --require-origin-main-head --skip-if-superseded \
            ${EXPECTED_SHA:+--expected-head "$EXPECTED_SHA"}
