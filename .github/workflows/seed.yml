name: Seed + publish

# Dispatch target of the refresh crons: pushes made with GITHUB_TOKEN do not
# trigger push workflows, so they `gh workflow run` this one. Publishes the
# flat layout only; the live Space reads a separate layout and is not restarted.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Refresh workflow run waiting for this release (optional)"
        required: false
        type: string
      expected_sha:
        description: "Full 40-hex commit the caller pushed; the run checks out and publishes exactly this"
        required: false
        type: string

run-name: Seed + publish (${{ inputs.source_run_id || 'manual' }})

permissions:
  contents: read

concurrency:
  # `registry-data-publish` is shared with publish-registry-data.yml. An
  # off-main manual dispatch gets its own lane so it cannot displace a pending
  # production release before the guard step rejects it.
  group: ${{ github.ref == 'refs/heads/main' && 'registry-data-publish' || format('seed-nonproduction-{0}', github.run_id) }}
  cancel-in-progress: false
  # Hold every arrival: 'single' cancels the older pending run, and dispatched
  # children must never displace each other while their parent refreshes wait.
  queue: max

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Guard production ref
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::seed + publish is production-only and must run from refs/heads/main"
          exit 1

      # A dispatch resolves `--ref main` to the branch head GitHub sees at that
      # instant, which can predate the caller's push: a pinned expected_sha is
      # checked out by SHA; an unpinned dispatch gets the live tip, not the
      # github.sha that goes stale while queued.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_sha || github.ref }}

      # github.sha is the dispatch-time branch resolution, never the published
      # revision.
      - name: Assert checkout is the expected commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          echo "event ref=${{ github.ref }} event sha=${{ github.sha }} checked-out HEAD=$(git rev-parse HEAD) expected=${EXPECTED_SHA:-<none>}"
          if [ -n "$EXPECTED_SHA" ]; then
            echo "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::expected_sha must be a full 40-hex sha"; exit 1; }
            [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ] || { echo "::error::checkout is not expected_sha"; exit 1; }
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Sync dependencies
        run: uv sync

      # Superseded (main moved forward past this checkout) is a green skip: the
      # newer head's own publish covers this tree. Diverged still fails.
      - name: Skip if superseded
        id: fresh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          uv run python scripts/publish_registry_data.py --freshness-check-only \
            --require-origin-main-head --skip-if-superseded \
            ${EXPECTED_SHA:+--expected-head "$EXPECTED_SHA"}

      - name: Seed (validate merge)
        if: steps.fresh.outputs.superseded != 'true'
        run: LOCAL_MODE=true uv run eval-entity-registry seed --local

      - name: Run pytest
        if: steps.fresh.outputs.superseded != 'true'
        run: LOCAL_MODE=true uv run pytest -q

      # --skip-seed: the fixture bytes just tested are what gets published; a
      # second seed would change generated ids and timestamps.
      - name: Publish tested registry data
        if: steps.fresh.outputs.superseded != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          uv run python scripts/publish_registry_data.py --skip-seed \
            --require-origin-main-head --skip-if-superseded \
            ${EXPECTED_SHA:+--expected-head "$EXPECTED_SHA"}
