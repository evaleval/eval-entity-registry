name: Refresh hub-stats source

on:
  schedule:
    # Twice daily. Upstream cfahlgren1/hub-stats pushes its daily files at
    # ~13:18–13:59 UTC. GitHub delays these crons by 3–9 h (observed), so a
    # single slot cannot be placed reliably after the upload. Two slots make
    # same-day freshness a guarantee, not a bet: 11:37 lands ~14:30–20:30
    # (usually after the upload); 21:37 lands ~00:30–06:30 and always sees it.
    # The pinned-snapshot read makes the upload window irrelevant for
    # correctness, and a run whose upstream sha256 is unchanged short-circuits
    # before the download (only the smoke + gate steps run). The gap after
    # refresh-models (09:07) is only a hint; the shared registry-seed-writer
    # concurrency group below is what serialises the two writers. Minutes sit
    # off the hour because GitHub documents on-the-hour schedules as the most
    # delayed.
    - cron: "37 11 * * *"
    - cron: "37 21 * * *"
  workflow_dispatch: {}

# Direct-commit auto-sync (no PR review). Switch to PR mode if human review of
# refreshes becomes warranted.
permissions:
  contents: write
  # `gh workflow run seed.yml` (downstream dispatch) requires actions:write.
  actions: write
  # The stall beacon (final steps) opens/closes a single sticky tracking issue.
  issues: write

env:
  GENERATED_PATH: seed/models/sources/hub_stats.generated.yaml
  STATE_PATH: seed/models/sources/hub_stats.state.json

# One writer to main at a time. The group name is hard-coded and SHARED with
# refresh-models.yml on purpose: it must NOT include github.workflow, or the
# two writers get separate lanes and can again race each other's push and
# seed.yml dispatch when the crons drift into the same window.
concurrency:
  group: registry-seed-writer
  cancel-in-progress: false
  # Hold every arrival; the default 'single' cancels the waiting writer, and a
  # run that never starts cannot raise its own stall beacon.
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Include headroom for the correlated seed/publish child to queue behind
    # another live publisher and then consume its own 60-minute budget.
    timeout-minutes: 180
    steps:
      # Check out the LIVE tip of the branch, not github.sha. GitHub pins
      # github.sha when the run is CREATED, and the concurrency group above can
      # hold this run for the whole duration of the other seed writer. The
      # default checkout would then regenerate against a head that is already
      # behind main, pass the gate, and have its push rejected ("fetch first")
      # 30 minutes later — the serialisation worked, the stale checkout defeated
      # it (observed 2026-09-13, 2026-10-16). A branch ref resolves at fetch time.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Record base commit
        run: |
          head="$(git rev-parse HEAD)"
          echo "checked-out HEAD=${head} event sha=${{ github.sha }}"
          if [ "$head" != "${{ github.sha }}" ]; then
            echo "::notice::run was created for ${{ github.sha }} but main had moved; regenerating against live tip ${head}"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Sync dependencies
        run: uv sync

      - name: Refresh hub-stats generated source
        env:
          # Authenticated resolver HEAD + xet-token call + download (the Hub's
          # per-bucket limits are in its `ratelimit-policy` response header).
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # --live: the cron's job is FRESHNESS, so it reads a fresh upstream
        # snapshot rather than the committed offline cache (the script's
        # default, used for reproducible regens). The snapshot is
        # cfahlgren1/hub-stats main/models.parquet PINNED to one commit sha,
        # downloaded once with hf_hub_download (~1.6 GB) and queried locally.
        # It never touches the HF parquet-converter endpoint, which 400s for
        # minutes after every upstream commit (specs/hub-stats-snapshot-fetch.md).
        # An unchanged upstream sha256 short-circuits before the download.
        run: uv run python scripts/refresh_from_hub_stats.py --live

      # SMOKE tier (must pass — RED on failure). The YAML must parse, the seed
      # loader must run, and the gate suite must COLLECT cleanly (catches import /
      # path / module-load breakage). A failure here is pipeline breakage, not a
      # data issue, so it stays loud RED to stand out from a routine skip.
      - name: Smoke checks (pipeline integrity)
        run: |
          uv run python -c "import yaml; yaml.safe_load(open('$GENERATED_PATH'))"
          # The frozen oracle is read at gate RUNTIME (inside a fixture/test
          # body, not at collection), so pytest --collect-only below would NOT
          # catch a missing/corrupt oracle. Assert it loudly HERE so a relocated/
          # missing-oracle regression fails as an INFRA error in this smoke step
          # (distinct from, and as loud as, a data-regression in the next step).
          uv run python -c "import json; from eval_entity_registry.lib.seed_io import resolve_oracle_path as r; p=r(); assert p.exists(), f'oracle missing: {p}'; assert 'resolutions' in json.loads(p.read_text()), f'oracle malformed: {p}'"
          LOCAL_MODE=true uv run eval-entity-registry seed --local
          LOCAL_MODE=true uv run pytest tests/test_gate_invariants.py --collect-only -q

      # REGRESSION gate — the invariant suite over the fixtures that the smoke
      # step's `seed --local` just wrote to fixtures/ (this step CONSUMES that
      # output; keep it after the smoke step). A regen that re-mints a shadow,
      # re-splits an org (e.g. reverts a same-uploader merge), or regresses a
      # known resolution outcome FAILS here and the named step turns the job RED,
      # so a stalled refresh is visible (not silently skipped). It is
      # distinguishable from pipeline breakage by WHICH step failed: a smoke-step
      # failure is infra; this step failing means "today's upstream would regress
      # data, so nothing was committed." A failure here halts the job before
      # Detect, so the commit/deploy steps never run.
      # The models.dev dedup/confluence suite is part of this gate too:
      # hub_stats.generated.yaml is an INPUT to the models_dev reconcile, so a
      # hub-stats refresh that changes which models_dev mints are suppressed /
      # donated would silently break the committed models_dev fixpoint (the
      # confluence tests) while this cron stays green. Gate on it so such a
      # refresh ABORTS (skips the day) instead of committing incoherence.
      - name: Regression gate (blocks commit on data regression)
        run: LOCAL_MODE=true uv run pytest tests/test_gate_invariants.py tests/test_refresh_modelsdev_dedup.py -q

      - name: Detect changes
        id: diff
        run: |
          # Two output flags:
          #   data_changed → YAML changed; downstream seed.yml dispatch needed.
          #   state_changed → only the snapshot watermark moved (no parquet diff
          #                   matched our candidate set this cycle); commit it
          #                   alone so tomorrow's run can short-circuit.
          if git diff --quiet "$GENERATED_PATH"; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat "$GENERATED_PATH"
          fi
          if git diff --quiet "$STATE_PATH" 2>/dev/null && [ -z "$(git status --porcelain "$STATE_PATH")" ]; then
            echo "state_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "state_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet "$GENERATED_PATH" && git diff --quiet "$STATE_PATH" 2>/dev/null && [ -z "$(git status --porcelain "$STATE_PATH")" ]; then
            echo "::notice::No changes to $GENERATED_PATH or $STATE_PATH — nothing to commit."
          fi

      - name: Commit + push directly
        id: commit
        if: steps.diff.outputs.data_changed == 'true' || steps.diff.outputs.state_changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GENERATED_PATH" "$STATE_PATH"
          if [ "${{ steps.diff.outputs.data_changed }}" = "true" ]; then
            msg="chore(seed): refresh hub-stats source ($(date -u +%Y-%m-%d))"
          else
            msg="chore(seed): bump hub-stats snapshot watermark ($(date -u +%Y-%m-%d))"
          fi
          git commit -m "$msg"
          # Never rebase after the gate: that would push a tree we did not test.
          # The checkout is the live tip taken AFTER the writer queue released
          # us, so the only way this push can be rejected is a human push
          # during the ~10-minute gate window; that fails safely and the next
          # cron regenerates against the new head.
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Retry a previous publish failure even when today's generated data is
      # unchanged; the sticky issue is the durable recovery signal.
      - name: Decide whether registry publish is needed
        id: deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stalled=$(gh issue list --label refresh-hub-stats-stalled --state open --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "${{ steps.diff.outputs.data_changed }}" = "true" ] || [ "$stalled" != "0" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      # Wait for the correlated seed + flat-data publish to finish. Dispatch
      # acceptance alone is not deployment success.
      - name: Publish and wait for verified completion
        if: steps.deploy.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pin the child to the commit this run pushed, so a stale branch
          # resolution of --ref main cannot make it publish someone else's tree.
          expected="${{ steps.commit.outputs.pushed_sha }}"
          # Beacon-retry path: nothing was committed today, so publish whatever
          # main currently holds.
          [ -n "$expected" ] || expected="$(git ls-remote origin refs/heads/main | cut -f1)"
          correlation="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="Seed + publish (${correlation})"
          dispatch=$(gh workflow run seed.yml --ref main -f source_run_id="${correlation}" -f expected_sha="$expected" 2>&1 | tee /dev/stderr)
          url=$(printf '%s\n' "$dispatch" | grep -oE 'actions/runs/[0-9]+' | head -n 1 || true)
          run_id="${url##*/}"
          if [ -z "$run_id" ]; then
            # Fallback for a gh build that prints no run URL: correlate by title.
            for attempt in $(seq 1 30); do
              run_id=$(gh run list --workflow seed.yml --event workflow_dispatch --branch main --limit 50 --json databaseId,displayTitle --jq ".[] | select(.displayTitle == \"$title\") | .databaseId" | head -n 1)
              [ -n "$run_id" ] && break
              sleep 5
            done
          fi
          if [ -z "$run_id" ]; then
            echo "::error::could not locate the correlated seed.yml run"
            exit 1
          fi
          gh run watch "$run_id" --exit-status

      # Stall beacon — ONE sticky tracking issue (deduplicated by the
      # `refresh-hub-stats-stalled` label), never a new issue per run. ANY failure
      # or cancellation (infra / data-regression / timeout / commit / dispatch) opens-or-comments the
      # single issue. It is CLEARED only after a correlated downstream publish
      # finishes successfully — never on dispatch acknowledgement alone. A
      # committed-but-unpublished refresh is retried while the issue remains.
      # All `gh` calls are best-effort (|| true) so a beacon-side
      # API hiccup can't flip the run's real status.
      - name: Raise/refresh stall beacon
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          label="refresh-hub-stats-stalled"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          outcome="${{ job.status }}"
          body="refresh-hub-stats run ended ${outcome} on $(date -u +%F) — cause may be infra, timeout/cancellation, a data-regression gate, commit, or downstream publish; inspect the run: ${run_url}. Auto-closes only after a correlated publish succeeds."
          gh label create "$label" --color FBCA04 --description "refresh-hub-stats cron is failing/blocked" 2>/dev/null || true
          num=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body" || true
          else
            gh issue create --title "⚠️ refresh-hub-stats cron run failed" --label "$label" --body "$body" || true
          fi

      - name: Clear stall beacon
        if: success() && steps.deploy.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          label="refresh-hub-stats-stalled"
          for num in $(gh issue list --label "$label" --state open --json number --jq '.[].number' 2>/dev/null || true); do
            gh issue comment "$num" --body "✅ Resolved on $(date -u +%F) — the correlated seed + flat-data publish completed successfully. Closing." || true
            gh issue close "$num" || true
          done
