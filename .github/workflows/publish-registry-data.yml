name: Publish registry data

# Publishes the flat canonical parquets the producer reads. The live Space
# reads a separate per-table subdir layout; this workflow never restarts it.

on:
  pull_request:
    branches: [main]
    paths:
      - "seed/**"
      - "src/**"
      - "packages/eval-entity-resolver/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/publish-registry-data.yml"
  push:
    branches: [main]
    paths:
      - "seed/**"
      - "src/**"
      - "packages/eval-entity-resolver/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/publish-registry-data.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# Concurrency is per job because GitHub rejects `queue: max` together with
# cancel-in-progress: the PR dry-run cancels superseded runs; the publish
# joins the `registry-data-publish` lane (invariant stated in seed.yml).

jobs:
  reject-nonproduction-manual-run:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-production ref
        run: |
          echo "::error::registry data publishing is production-only and must run from refs/heads/main"
          exit 1

  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-registry-data-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Sync dependencies
        run: uv sync

      # fixtures/ is gitignored, so the gate suite validates nothing unless the
      # YAML under review is seeded first.
      - name: Seed fixtures from the YAML under review
        run: LOCAL_MODE=true uv run eval-entity-registry seed --local

      - name: Run pytest (gates validate the seeded fixtures)
        run: LOCAL_MODE=true uv run pytest

      - name: Publish registry data (--dry-run)
        run: uv run python scripts/publish_registry_data.py --dry-run --skip-seed

      - name: Surface manifest in CI log
        run: cat fixtures/manifest.json

  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: registry-data-publish
      cancel-in-progress: false
      queue: max
    timeout-minutes: 60
    steps:
      # Live tip of main, not github.sha: main may move while this run is queued.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Sync dependencies
        run: uv sync

      # Superseded-vs-diverged rule: see seed.yml.
      - name: Skip if superseded
        id: fresh
        run: >-
          uv run python scripts/publish_registry_data.py --freshness-check-only
          --require-origin-main-head --skip-if-superseded

      - name: Seed fixtures from the checkout being published
        if: steps.fresh.outputs.superseded != 'true'
        run: LOCAL_MODE=true uv run eval-entity-registry seed --local

      - name: Run pytest before publishing
        if: steps.fresh.outputs.superseded != 'true'
        run: LOCAL_MODE=true uv run pytest

      - name: Publish registry data
        if: steps.fresh.outputs.superseded != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # --skip-seed: see seed.yml.
        run: >-
          uv run python scripts/publish_registry_data.py --skip-seed
          --require-origin-main-head --skip-if-superseded
