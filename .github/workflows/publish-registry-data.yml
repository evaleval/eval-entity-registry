name: Publish registry data

# Publishes the registry's flat canonical parquets to
# evaleval/entity-registry-data via scripts/publish_registry_data.py. These are
# the versioned producer/backend inputs. The legacy live Space reads a separate
# partitioned layout; migrating that larger historical universe is deliberately
# outside this workflow and this workflow must not claim to deploy/restart it.
#
#   - On PRs that touch seed YAML or registry code: --dry-run + tests.
#     Catches schema breakage / parse failures before merge without
#     publishing.
#
#   - On push to main: real publish to evaleval/entity-registry-data.
#     Idempotent — the script reads the remote manifest.json and
#     skips the upload if content_hash hasn't changed.
#
# See notes/hierarchy-alignment.md for the design.

on:
  pull_request:
    branches: [main]
    paths:
      - "seed/**"
      - "src/**"
      - "packages/eval-entity-resolver/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/publish-registry-data.yml"
  push:
    branches: [main]
    paths:
      - "seed/**"
      - "src/**"
      - "packages/eval-entity-resolver/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/publish-registry-data.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# Concurrency is declared per job below. The PR dry-run cancels an obsolete
# run for the same PR; the production publish joins the `registry-data-publish`
# lane shared with seed.yml, where every arrival must be held rather than
# superseded (GitHub rejects `queue: max` together with cancellation, so the
# two cannot share one workflow-level block).

jobs:
  reject-nonproduction-manual-run:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-production ref
        run: |
          echo "::error::registry data publishing is production-only and must run from refs/heads/main"
          exit 1

  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-registry-data-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Seeds, runs the full gate suite, then inspects those exact fixtures.
    # The seed grew with the carry-forward/enrichment work, so 15 min now
    # clips the trailing publish step after the gates have already passed.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          # publish_registry_data.py reads `git rev-parse HEAD` for the
          # manifest's seed_git_sha. Default fetch-depth=1 is fine; full
          # history isn't required.
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Sync dependencies
        run: uv sync

      # Seed the parquet fixtures FROM the YAML under review first — fixtures
      # are gitignored (generated), so without this the gate suite
      # (tests/test_gate_invariants.py) reads no fixtures and cannot validate
      # the seed under change. Seeding here makes the PR check actually exercise
      # the gates against the diff. Mirrors seed.yml.
      - name: Seed fixtures from the YAML under review
        run: LOCAL_MODE=true uv run eval-entity-registry seed --local

      - name: Run pytest (gates validate the seeded fixtures)
        run: LOCAL_MODE=true uv run pytest

      - name: Publish registry data (--dry-run)
        run: uv run python scripts/publish_registry_data.py --dry-run --skip-seed

      - name: Surface manifest in CI log
        run: cat fixtures/manifest.json

  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Same lane as seed.yml: hold every arrival; 'single' would let a queued
    # publish and a dispatched seed child cancel each other.
    concurrency:
      group: registry-data-publish
      cancel-in-progress: false
      queue: max
    # Main must prove the exact checkout is seedable and regression-clean before
    # it can mutate the remote dataset. The full suite can take 15–25 minutes on
    # hosted runners, so leave bounded headroom for setup and upload.
    timeout-minutes: 60
    steps:
      # Publish the LIVE tip of main, not github.sha. The pushed sha is
      # resolved when the run is created; by the time the registry-data-publish
      # queue releases us, main may already be ahead (a cron push, or the next
      # human push). Publishing the current tip is always correct — the data is
      # a function of main's tree and the newer commit's own run then no-ops on
      # content_hash — and it stops a queued run from failing the freshness
      # guard 15 minutes in.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Sync dependencies
        run: uv sync

      # Superseded = main moved FORWARD past this checkout. The newer head's own
      # publish covers a superset of this tree, so finish green without the
      # seed + test minutes. Diverged / unverifiable still fails.
      - name: Skip if superseded
        id: fresh
        run: >-
          uv run python scripts/publish_registry_data.py --freshness-check-only
          --require-origin-main-head --skip-if-superseded

      - name: Seed fixtures from the checkout being published
        if: steps.fresh.outputs.superseded != 'true'
        run: LOCAL_MODE=true uv run eval-entity-registry seed --local

      - name: Run pytest before publishing
        if: steps.fresh.outputs.superseded != 'true'
        run: LOCAL_MODE=true uv run pytest

      - name: Publish registry data
        if: steps.fresh.outputs.superseded != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # Do not seed again here: the exact fixture bytes above passed pytest.
        # The guard re-runs at upload time; a head that moved forward DURING
        # the tests is again a skip, never a rollback.
        run: >-
          uv run python scripts/publish_registry_data.py --skip-seed
          --require-origin-main-head --skip-if-superseded
