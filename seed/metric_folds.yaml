# Per-benchmark metric naming folds (merged-benchmark-view spec, R2).
# An entry states: `from_metric` reported on `benchmark` IS the same
# measurement as `to_metric`, published under a generic name. An unscoped
# fold applies to every source reporting from_metric on that benchmark — so
# it is only valid when NO source uses that metric name for a different
# measurement on the same benchmark; otherwise scope it to the sources it
# describes (see `source_config` below). (That conflict is why hle needed a
# producer hotfix first, and why alpacaeval-2-0 / math / truthfulqa /
# scicode carry no score fold at all).
# NAMING FOLDS ONLY — protocol variants (cot-correct, exact-match under a
# different elicitation) never fold.
#
# A row with no `source_config` is the benchmark-wide naming fold and never
# carries a conversion. A row WITH `source_config` applies to that one source
# and wins over the benchmark-wide row for it. It may carry the published-scale
# conversion for that source (affine, canonical = published * scale_factor +
# scale_offset), leave the metric unchanged (from_metric == to_metric) when a
# source differs only in scale, or rename for that source alone when other
# sources use the same metric name for a different measurement. Beside a
# benchmark-wide row it must name the same to_metric.
#
# `lower_is_better` (optional) is the benchmark's own direction for
# `to_metric` on that benchmark (for that source, if scoped), overriding the
# metric's registry default. A row with from_metric == to_metric may carry
# only that.
#
# `source_config` is the UPSTREAM DATASET CONFIG NAME as published in the EEE
# datastore (`data/<config>/`) — `openeval`, `llm-stats`, `helm_capabilities`,
# … It is not a registry id and it is not normalised: `llm-stats` and
# `llm_stats` name different configs.
#
# Verified against warehouse snapshot 2026-08-13T22-02-24Z score ranges.

